services:
  # ============================================
  # BACKEND SERVICE (FastAPI + yt-dlp + FFmpeg)
  # ============================================
  - type: web
    name: video-downloader-backend
    runtime: docker
    plan: free
    region: singapore          # apne nearest region choose karein
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DOWNLOAD_DIR
        value: /data/downloads
      - key: DB_URL
        value: sqlite+aiosqlite:///./downloader.db
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: FILE_TTL_HOURS
        value: "6"
      - key: CORS_ORIGINS
        value: https://video-downloader-frontend.onrender.com,http://localhost:5173
      - key: PYTHONUNBUFFERED
        value: "1"
      # Uncomment agar proxy use karna ho
      # - key: PROXY_URL
      #   sync: false
      # Uncomment agar cookies file use karni ho
      # - key: COOKIES_FILE
      #   value: ./cookies.txt

  # ============================================
  # FRONTEND SERVICE (React + Vite Static Site)
  # ============================================
  - type: web
    name: video-downloader-frontend
    runtime: static
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://video-downloader-backend.onrender.com
      - key: NODE_VERSION
        value: "20"
    routes:
      # SPA fallback — React Router ke liye zaroori
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Security headers (optional but recommended)
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff